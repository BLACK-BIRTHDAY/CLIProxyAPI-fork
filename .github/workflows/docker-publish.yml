name: Docker & Windows Release Publish

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch or tag ref to checkout when invoked via workflow_call'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  docker-publish:
    name: Build & Publish Docker Image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          else
            echo "DOCKERHUB secrets not configured, skipping Docker Hub login."
          fi

      - name: Prepare build metadata and tags
        id: meta
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="${GITHUB_REF_NAME}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER_LOWER}/cliproxyapi:latest"
            echo "ghcr.io/${OWNER_LOWER}/cliproxyapi:${SHORT_SHA}"
            if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/${DOCKERHUB_USER}/cliproxyapi:latest"
              echo "docker.io/${DOCKERHUB_USER}/cliproxyapi:${SHORT_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared Docker image tags:"
          echo "ghcr.io/${OWNER_LOWER}/cliproxyapi:latest"
          echo "ghcr.io/${OWNER_LOWER}/cliproxyapi:${SHORT_SHA}"
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "docker.io/${DOCKERHUB_USER}/cliproxyapi:latest"
            echo "docker.io/${DOCKERHUB_USER}/cliproxyapi:${SHORT_SHA}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-package:
    name: Build & Publish Windows x64 Update Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build CLIProxyAPI Windows x64 Package
        id: build_win
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_TAG=$(date -u +%Y%m%d)
          RELEASE_VERSION="cpa-${DATE_TAG}-${SHORT_SHA}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

          STAGE_DIR="dist/windows-amd64"
          rm -rf dist
          mkdir -p "$STAGE_DIR"

          echo "Building cli-proxy-api.exe (${RELEASE_VERSION})..."
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -buildvcs=false \
            -ldflags="-s -w -X 'main.Version=${RELEASE_VERSION}' -X 'main.Commit=${SHORT_SHA}' -X 'main.BuildDate=${BUILD_DATE}'" \
            -o "${STAGE_DIR}/cli-proxy-api.exe" ./cmd/server/

          echo "Downloading latest management.html..."
          mkdir -p "${STAGE_DIR}/static"
          curl -fsSL "https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/latest/download/management.html" -o "${STAGE_DIR}/static/management.html" || \
            curl -fsSL "https://cpamc.router-for.me/" -o "${STAGE_DIR}/static/management.html"

          cp LICENSE README.md README_CN.md config.example.yaml "${STAGE_DIR}/"
          cp "${STAGE_DIR}/cli-proxy-api.exe" "dist/cli-proxy-api-windows-amd64.exe"

          ZIP_VERSIONED="dist/CLIProxyAPI_${RELEASE_VERSION}_windows_amd64.zip"
          ZIP_LATEST="dist/CLIProxyAPI_windows_amd64.zip"

          powershell -NoProfile -Command "Compress-Archive -Path '${STAGE_DIR}/*' -DestinationPath '${ZIP_VERSIONED}' -Force"
          cp "$ZIP_VERSIONED" "$ZIP_LATEST"

          (
            cd dist
            sha256sum CLIProxyAPI_windows_amd64.zip "CLIProxyAPI_${RELEASE_VERSION}_windows_amd64.zip" cli-proxy-api-windows-amd64.exe > checksums-windows-amd64.txt
          )

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPI-windows-amd64
          path: |
            dist/CLIProxyAPI_windows_amd64.zip
            dist/CLIProxyAPI_${{ steps.build_win.outputs.release_version }}_windows_amd64.zip
            dist/cli-proxy-api-windows-amd64.exe
            dist/checksums-windows-amd64.txt
          if-no-files-found: error

      - name: Publish to GitHub Release (latest)
        if: github.ref == 'refs/heads/main' || inputs.ref == 'main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          TITLE="Latest Automated Build (${{ steps.build_win.outputs.release_version }})"
          NOTES="Automated build from commit \`${{ steps.build_win.outputs.short_sha }}\` at \`${{ steps.build_win.outputs.build_date }}\`.

          ### Included Assets
          - \`CLIProxyAPI_windows_amd64.zip\`: Full Windows x64 update bundle (\`cli-proxy-api.exe\` + \`static/management.html\` + \`config.example.yaml\`)
          - \`cli-proxy-api-windows-amd64.exe\`: Standalone Windows x64 gateway executable
          - \`checksums-windows-amd64.txt\`: SHA-256 digests"

          HEAD_SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$HEAD_SHA"
          git push origin "refs/tags/${TAG}" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi

          gh release upload "$TAG" \
            dist/CLIProxyAPI_windows_amd64.zip \
            "dist/CLIProxyAPI_${{ steps.build_win.outputs.release_version }}_windows_amd64.zip" \
            dist/cli-proxy-api-windows-amd64.exe \
            dist/checksums-windows-amd64.txt \
            --clobber
